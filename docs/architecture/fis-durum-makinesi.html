<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS-INTERN-PROJECT · Fiş Durumu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 640px;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Machine · CRS-INTERN-PROJECT</p>
    <h1>Fiş durumu yaşam döngüsü</h1>
    <p class="subtitle">Bir fiş yüklendiğinde Beklemede durumuna girer; admin onayı veya reddiyle son duruma geçer.</p>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crs-state-title crs-state-desc">
      <title id="crs-state-title">Fiş durumu yaşam döngüsü</title>
      <desc id="crs-state-desc">State machine showing a receipt moving from Pending to either Approved or Rejected after admin review, with Approved and Rejected as terminal states.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Start marker -->
      <circle cx="500" cy="56" r="6" fill="#2d3142"/>
      <line x1="500" y1="62" x2="500" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transitions -->
      <!-- Pending -> Approved -->
      <path d="M464,160 V212 Q464,220 456,220 H248 Q240,220 240,228 V280"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Pending -> Rejected -->
      <path d="M536,160 V212 Q536,220 544,220 H752 Q760,220 760,228 V280"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="324" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVE</text>

      <rect x="624" y="200" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECT</text>

      <!-- End markers -->
      <line x1="240" y1="344" x2="240" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="240" cy="376" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="240" cy="376" r="5" fill="#2d3142"/>

      <line x1="760" y1="344" x2="760" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="760" cy="376" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="760" cy="376" r="5" fill="#2d3142"/>

      <!-- Annotation: side-effect that isn't a state transition -->
      <line x1="400" y1="292" x2="400" y2="344" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="412" y="300" fill="#4f5d75" font-style="italic" font-size="12" font-family="'Instrument Serif', serif">Approved → sadakat puanı</text>
      <text x="412" y="316" fill="#4f5d75" font-style="italic" font-size="12" font-family="'Instrument Serif', serif">eklenir; her 5 fişte 1 kupon</text>
      <text x="412" y="332" fill="#4f5d75" font-style="italic" font-size="12" font-family="'Instrument Serif', serif">üretilir (CouponService)</text>

      <!-- Node: Pending -->
      <rect x="400" y="96" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="400" y="96" width="200" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Beklemede</text>
      <text x="500" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ReceiptStatus.Pending</text>

      <!-- Node: Approved (focal) -->
      <rect x="140" y="280" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="140" y="280" width="200" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="240" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Onaylandı</text>
      <text x="240" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ReceiptStatus.Approved</text>

      <!-- Node: Rejected -->
      <rect x="660" y="280" width="200" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="660" y="280" width="200" height="64" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="760" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reddedildi</text>
      <text x="760" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ReceiptStatus.Rejected</text>

      <!-- Legend strip -->
      <line x1="60" y1="404" x2="940" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="60" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="80" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Beklemede</text>

      <rect x="200" y="436" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="220" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Onaylandı (odak)</text>

      <rect x="380" y="436" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="400" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reddedildi</text>

      <circle cx="596" cy="441" r="6" fill="#2d3142"/>
      <text x="612" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Başlangıç</text>

      <circle cx="680" cy="441" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="680" cy="441" r="5" fill="#2d3142"/>
      <text x="700" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Son durum</text>
    </svg>
  </div>
</body>
</html>
