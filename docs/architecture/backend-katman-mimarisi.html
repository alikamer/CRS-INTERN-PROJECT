<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS-INTERN-PROJECT · Layer Stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 640px;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer Stack · CRS-INTERN-PROJECT</p>
    <h1>Backend katman mimarisi</h1>
    <p class="subtitle">Controller'lar ince kalır, iş mantığı Services katmanında yaşar.</p>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crs-layers-title crs-layers-desc">
      <title id="crs-layers-title">CRS-INTERN-PROJECT — backend katman mimarisi</title>
      <desc id="crs-layers-desc">Layer stack diagram showing the backend's five layers top to bottom: Controllers, Services, Entities and DTOs, AppDbContext, and PostgreSQL, with the Services layer marked as the focal layer holding all business logic.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Direction indicator (left margin, outside the stack) -->
      <text x="72" y="88" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">İSTEK</text>
      <line x1="72" y1="112" x2="72" y2="408" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Outer stack silhouette (white, ink border) -->
      <rect x="100" y="100" width="800" height="320" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <!-- Focal layer tint: Services -->
      <rect x="100" y="164" width="800" height="64" fill="rgba(235,108,54,0.08)"/>

      <!-- Divider hairlines between layers -->
      <line x1="100" y1="164" x2="900" y2="164" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="100" y1="228" x2="900" y2="228" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="100" y1="292" x2="900" y2="292" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="100" y1="356" x2="900" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- Focal layer accent border (drawn over the gray dividers on its edges) -->
      <rect x="100" y="164" width="800" height="64" fill="none" stroke="#eb6c36" stroke-width="1.2"/>

      <!-- Row 1: Controllers -->
      <text x="124" y="136" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">01</text>
      <text x="180" y="137" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Controllers</text>
      <text x="884" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">6× · route api/[controller] · thin</text>

      <!-- Row 2: Services (focal) -->
      <text x="124" y="200" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">02</text>
      <text x="180" y="201" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Services</text>
      <text x="884" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">I&lt;Area&gt;Service · tüm iş mantığı + DB</text>

      <!-- Row 3: Entities & DTOs -->
      <text x="124" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">03</text>
      <text x="180" y="265" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Entities &amp; DTOs</text>
      <text x="884" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">EF Core models · DTOs/&lt;Area&gt;</text>

      <!-- Row 4: AppDbContext -->
      <text x="124" y="328" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">04</text>
      <text x="180" y="329" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">AppDbContext</text>
      <text x="884" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">OnModelCreating · ilişkiler</text>

      <!-- Row 5: PostgreSQL -->
      <text x="124" y="392" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">05</text>
      <text x="180" y="393" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">PostgreSQL</text>
      <text x="884" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">fiziksel veri deposu</text>

      <!-- Legend -->
      <line x1="100" y1="440" x2="900" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="100" y="456" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="120" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal katman — iş mantığı burada yaşar, controller'lar ince kalır</text>
    </svg>
  </div>
</body>
</html>
