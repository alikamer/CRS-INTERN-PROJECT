<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS-INTERN-PROJECT · Yardımcı Tablolar</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 680px;
    }

    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER / Veri Modeli · CRS-INTERN-PROJECT</p>
    <h1>Yardımcı tablolar</h1>
    <p class="subtitle">Ana şemayı (veri-modeli-er.html) destekleyen oturum/operasyonel tablolar. Sağdaki soluk kutular ana şemadaki gerçek tabloların referanslarıdır, burada tekrar tanımlanmıyor.</p>

    <svg viewBox="0 0 880 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crs-er-aux-title crs-er-aux-desc">

      <desc id="crs-er-aux-desc">Varlık-ilişki diyagramı: RefreshToken, TenantInvite ve ConsumerLoyalty operasyonel tablolarının ana şemadaki AppUser, Tenant, ConsumerProfile ve Brand tablolarına bağlantılarını gösterir.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Relationship connectors (drawn before boxes) ============ -->

      <!-- 1: RefreshToken -> AppUser (N-1) -->
      <path d="M320,120 H452 Q460,120 460,112 V108 Q460,100 468,100 H600"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 2: TenantInvite -> Tenant (N-1) -->
      <path d="M320,360 H452 Q460,360 460,352 V248 Q460,240 468,240 H600"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 3: ConsumerLoyalty -> ConsumerProfile (N-1) -->
      <path d="M320,520 H452 Q460,520 460,512 V388 Q460,380 468,380 H600"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 4: ConsumerLoyalty -> Brand (N-1) -->
      <path d="M320,540 H452 Q460,540 460,532 V528 Q460,520 468,520 H600"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <text x="334" y="124" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>
      <rect x="578" y="94" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="104" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <rect x="326" y="354" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="334" y="364" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>
      <rect x="578" y="234" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="244" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <text x="334" y="524" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>
      <rect x="578" y="374" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="384" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <rect x="326" y="534" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="334" y="544" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>
      <rect x="578" y="514" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="524" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <!-- ============ Real entities (left column) ============ -->

      <rect x="40" y="40" width="280" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
      <rect x="40" y="72" width="280" height="8" fill="rgba(45,49,66,0.04)"/>

      <text x="56" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>

      <text x="56" y="100" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># Id</text>
      <text x="304" y="100" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

      <text x="304" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

      <!-- Entity: ConsumerLoyalty -->

      <rect x="40" y="472" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="40" y1="480" x2="320" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="56" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
      <text x="56" y="472" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">ConsumerLoyalty</text>
      <text x="56" y="500" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># Id</text>
      <text x="304" y="500" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
      <text x="56" y="520" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ ConsumerProfileId</text>
      <text x="304" y="520" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
      <text x="56" y="540" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ BrandId</text>
      <text x="304" y="540" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
      <text x="56" y="560" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">TotalReceiptCount</text>
      <text x="304" y="560" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="56" y="580" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">TotalPoints</text>
      <text x="304" y="580" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">numeric</text>

      <!-- ============ Reference stubs (right column — defined in the core-schema diagram) ============ -->

      <!-- Ref: AppUser -->

      <rect x="40" y="660" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <text x="500" y="668" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">#</text>
