<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS-INTERN-PROJECT · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 720px;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · CRS-INTERN-PROJECT</p>
    <h1>Fiş onayı → sadakat puanı → kupon</h1>
    <p class="subtitle">SystemAdmin bir fişi onayladığında backend sadakat puanı ekliyor; CouponService onaylı-ödüllendirilmemiş fişleri 5’li bloklara gruplayıp eşik karşılanırsa otomatik kupon üretiyor.</p>

    <svg viewBox="0 0 1300 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crs-lane-title crs-lane-desc">
      <title id="crs-lane-title">Fiş onayından kupona: dört aktörlü süreç</title>
      <desc id="crs-lane-desc">Swimlane diagram showing a consumer uploading a receipt, the backend creating a pending record, a system admin approving it, the backend awarding loyalty points, and a coupon service issuing a discount coupon once five approved receipts accumulate.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="0" y1="144" x2="1300" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="248" x2="1300" y2="248" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="352" x2="1300" y2="352" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- Lane labels -->
      <text x="16" y="96" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CONSUMER</text>
      <text x="16" y="200" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BACKEND</text>
      <text x="16" y="304" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ADMIN</text>
      <text x="16" y="408" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COUPON SVC</text>

      <!-- Arrows (behind boxes) -->

      <!-- A1: Consumer -> Backend (Receipt Oluştur) -->
      <path d="M220,124 V132 Q220,140 228,140 H444 Q452,140 452,148 V164"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A2: Backend (Receipt Oluştur) -> Admin -->
      <path d="M452,228 V236 Q452,244 460,244 H636 Q644,244 644,252 V268"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A3: Admin -> Backend (Puan Ekleme) — approval decision, accent -->
      <path d="M724,268 V256 Q724,248 732,248 H852 Q860,248 860,240 V228"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- A4: Backend (Puan Ekleme) -> CouponService — HTTP/internal call -->
      <path d="M916,228 V276 Q916,284 924,284 H1140 Q1148,284 1148,292 V372"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- A5: CouponService -> Backend (Puan Ekleme) — dashed return -->
      <path d="M1180,372 V324 Q1180,316 1172,316 H988 Q980,316 980,308 V228"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="316" y="120" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YÜKLE</text>

      <rect x="548" y="224" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">İNCELE</text>

      <rect x="760" y="228" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="237" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONAYLANDI</text>

      <rect x="1008" y="264" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1032" y="273" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KONTROL</text>

      <rect x="1056" y="296" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1076" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KUPON</text>

      <!-- Node: Consumer (actor) -->
      <rect x="120" y="60" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="60" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="128" y="68" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="142" y="77" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B2C</text>
      <text x="220" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fiş Yükleme</text>
      <text x="220" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Consumer → Frontend</text>

      <!-- Node: Backend — Receipt Oluştur -->
      <rect x="352" y="164" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="352" y="164" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="360" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="374" y="181" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="452" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receipt Oluştur</text>
      <text x="452" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ReceiptStatus=Pending</text>

      <!-- Node: Admin — İnceleme & Karar (focal) -->
      <rect x="584" y="268" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="268" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="592" y="276" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="606" y="285" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADM</text>
      <text x="684" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">İnceleme &amp; Karar</text>
      <text x="684" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AdminController</text>

      <!-- Node: Backend — Puan Ekleme -->
      <rect x="816" y="164" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="816" y="164" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="824" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="838" y="181" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="916" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Puan Ekleme</text>
      <text x="916" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ConsumerLoyalty +</text>

      <!-- Node: CouponService — Kupon Üretimi -->
      <rect x="1048" y="372" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1048" y="372" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1056" y="380" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1070" y="389" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="1148" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kupon Üretimi</text>
      <text x="1148" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 fiş / blok</text>

      <!-- Legend strip -->
      <line x1="40" y1="476" x2="1260" y2="476" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="508" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Karar noktası</text>

      <rect x="200" y="508" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Servis adımı</text>

      <rect x="360" y="508" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="380" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kullanıcı</text>

      <line x1="520" y1="512" x2="548" y2="512" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="556" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP çağrısı</text>

      <line x1="740" y1="512" x2="768" y2="512" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="776" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Onay / birincil akış</text>

      <line x1="940" y1="512" x2="968" y2="512" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="976" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dönüş / async</text>
    </svg>
  </div>
</body>
</html>
