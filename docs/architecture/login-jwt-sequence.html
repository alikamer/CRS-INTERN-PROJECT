<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS-INTERN-PROJECT · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 680px;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · CRS-INTERN-PROJECT</p>
    <h1>Login ve token yenileme</h1>
    <p class="subtitle">Access token 15 dakikada sona eriyor; frontend'in axios interceptor'ı 401 yanıtında otomatik olarak refresh token ile yeniler ve isteği tekrar dener.</p>

    <svg viewBox="0 0 1080 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crs-seq-title crs-seq-desc">
      <title id="crs-seq-title">CRS-INTERN-PROJECT — login ve token yenileme</title>
      <desc id="crs-seq-desc">Sequence diagram showing a user logging in through the frontend and backend with BCrypt-verified credentials and issued JWT tokens, followed by an opt fragment where the frontend automatically refreshes an expired access token after receiving a 401 response.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="120" y1="104" x2="120" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="400" y1="104" x2="400" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="680" y1="104" x2="680" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="960" y1="104" x2="960" y2="560" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- OPT fragment frame (Frontend <-> Backend only) -->
      <rect x="320" y="344" width="440" height="200" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="320" y="344" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="340" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="332" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">[access token süresi doldu]</text>

      <!-- Messages -->
      <line x1="120" y1="144" x2="396" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="404" y1="184" x2="676" y2="184" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="684" y1="224" x2="956" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="956" y1="264" x2="684" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="676" y1="304" x2="404" y2="304" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="404" y1="400" x2="676" y2="400" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="676" y1="440" x2="404" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="404" y1="480" x2="676" y2="480" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="676" y1="520" x2="404" y2="520" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Activation bars -->
      <rect x="396" y="144" width="8" height="172" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="676" y="184" width="8" height="132" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="956" y="224" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="396" y="396" width="8" height="136" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="676" y="400" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="676" y="480" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Message labels -->
      <rect x="208" y="124" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="133" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">EMAIL / ŞİFRE</text>

      <rect x="500" y="164" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="173" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /LOGIN</text>

      <rect x="768" y="204" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">BCRYPT DOĞRULA</text>

      <rect x="788" y="244" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DB YANITI</text>

      <rect x="500" y="284" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="293" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TOKEN ÇİFTİ</text>

      <rect x="488" y="380" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="389" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">ESKİ TOKEN İLE</text>

      <rect x="512" y="420" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">401 HATA</text>

      <rect x="488" y="460" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="469" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">REFRESH İSTEĞİ</text>

      <rect x="504" y="500" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">YENİ TOKEN</text>

      <!-- Actor boxes (top, drawn last so they sit above lifelines) -->
      <rect x="40" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="64" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="120" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kullanıcı</text>
      <text x="120" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tarayıcı</text>

      <rect x="320" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="40" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="344" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="400" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frontend</text>
      <text x="400" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">axios</text>

      <rect x="600" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="40" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="624" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="680" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend</text>
      <text x="680" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AuthController</text>

      <rect x="880" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="40" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="888" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="902" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="960" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Veritabanı</text>
      <text x="960" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Postgres</text>

      <!-- Legend strip -->
      <line x1="40" y1="580" x2="1040" y2="580" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="616" x2="68" y2="616" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">İstek (çağrı)</text>

      <line x1="200" y1="616" x2="228" y2="616" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="236" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Yanıt (dönüş)</text>

      <line x1="380" y1="616" x2="408" y2="616" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="416" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API</text>

      <line x1="540" y1="616" x2="568" y2="616" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="576" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ana başarı yanıtı</text>

      <rect x="740" y="611" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="756" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aktivasyon</text>
    </svg>
  </div>
</body>
</html>
