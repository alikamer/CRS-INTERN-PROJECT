<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS-INTERN-PROJECT · Org Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 640px;
    }

    svg { width: 100%; min-width: 700px; max-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Org Chart · CRS-INTERN-PROJECT</p>
    <h1>Roller ve sorumluluklar</h1>
    <p class="subtitle">Platform seviyesi (UserRole) ve şirket-içi seviye (TenantRole) sahiplik hiyerarşisi.</p>

    <svg viewBox="0 0 760 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crs-org-title crs-org-desc">
      <title id="crs-org-title">CRS-INTERN-PROJECT — roller ve sorumluluklar</title>
      <desc id="crs-org-desc">Org şeması: SystemAdmin platform yönetimini üstlenir; onaylı Tenant şirketleri Owner ve davetli Member rolleriyle yönetilirken, bağımsız Consumer hesapları ayrı bir denetim ilişkisiyle bağlanır.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first (behind boxes) -->

      <!-- SystemAdmin -> Tenant/Şirket (ownership chain) -->
      <path d="M348,104 V132 Q348,140 340,140 H208 Q200,140 200,148 V180"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- SystemAdmin -> Consumer (oversight, dashed) -->
      <path d="M412,104 V132 Q412,140 420,140 H572 Q580,140 580,148 V180"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Tenant -> Owner (straight, same x) -->
      <line x1="200" y1="244" x2="200" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Owner -> Member (straight, same x) -->
      <line x1="200" y1="384" x2="200" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="244" y="120" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONAYLAR</text>

      <rect x="460" y="120" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MODERASYON</text>

      <rect x="208" y="276" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="236" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YÖNETİR</text>

      <rect x="208" y="416" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="244" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DAVET EDER</text>

      <!-- Node: SystemAdmin (focal / root) -->
      <rect x="280" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="40" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="288" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="302" y="57" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYS</text>
      <text x="380" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SystemAdmin</text>
      <text x="380" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">platform yönetimi</text>

      <!-- Node: Tenant / Şirket (team) -->
      <rect x="100" y="180" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="180" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="108" y="188" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="122" y="197" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B2B</text>
      <text x="200" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tenant / Şirket</text>
      <text x="200" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">onaylı marka hesabı</text>

      <!-- Node: Consumer (independent actor) -->
      <rect x="480" y="180" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="180" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="488" y="188" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="502" y="197" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B2C</text>
      <text x="580" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Consumer</text>
      <text x="580" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bağımsız hesap</text>

      <!-- Node: Owner (TenantRole) -->
      <rect x="100" y="320" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="320" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="108" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="122" y="337" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OWN</text>
      <text x="200" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Owner</text>
      <text x="200" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TenantRole · yönetir</text>

      <!-- Node: Member (TenantRole) -->
      <rect x="100" y="460" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="460" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="108" y="468" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="122" y="477" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text>
      <text x="200" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Member</text>
      <text x="200" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TenantRole · davetli</text>

      <!-- Legend strip -->
      <line x1="60" y1="544" x2="700" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="60" y="576" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">SystemAdmin (kök)</text>

      <rect x="250" y="576" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="270" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tenant / ekip</text>

      <rect x="400" y="576" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="420" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Owner / Member</text>

      <rect x="580" y="576" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="600" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Consumer</text>

      <line x1="60" y1="604" x2="88" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="96" y="608" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sahiplik / rapor</text>

      <line x1="240" y1="604" x2="268" y2="604" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="276" y="608" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Denetim (moderasyon)</text>
    </svg>
  </div>
</body>
</html>
