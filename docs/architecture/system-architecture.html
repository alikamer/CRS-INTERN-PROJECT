<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS-INTERN-PROJECT · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 640px;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CRS-INTERN-PROJECT</p>
    <h1>System architecture</h1>
    <p class="subtitle">Consumers upload receipts for loyalty points; the aggregated shopping data is sold to brands as analytics dashboards.</p>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crs-architecture-title crs-architecture-desc">
      <title id="crs-architecture-title">CRS-INTERN-PROJECT — system architecture</title>
      <desc id="crs-architecture-desc">Architecture diagram showing consumer and corporate/admin users reaching a .NET backend through a React frontend, with the backend and a FastAPI analytics service both connected to a shared Postgres database.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first (behind boxes) -->

      <!-- Consumer -> Frontend -->
      <path d="M140,104 V132 Q140,140 148,140 H440 Q448,140 448,148 V180"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Corporate/Admin -> Frontend -->
      <path d="M840,104 V132 Q840,140 832,140 H560 Q552,140 552,148 V180"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Frontend -> Backend (straight, same x) -->
      <line x1="500" y1="244" x2="500" y2="320" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Backend -> Postgres (primary data flow, accent) -->
      <path d="M464,384 V412 Q464,420 456,420 H288 Q280,420 280,428 V460"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Backend -> python-analytics (HTTP call) -->
      <path d="M536,384 V412 Q536,420 544,420 H732 Q740,420 740,428 V460"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- python-analytics -> Postgres (read-only, dashed) -->
      <line x1="640" y1="492" x2="360" y2="492" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="508" y="276" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="285" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API</text>

      <rect x="340" y="400" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="372" y="409" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ/WRITE</text>

      <rect x="620" y="400" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="409" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

      <rect x="468" y="472" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text>

      <!-- Node: Consumer (input) -->
      <rect x="60" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="68" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="84" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B2C</text>
      <text x="140" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Consumer</text>
      <text x="140" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">receipt upload</text>

      <!-- Node: Corporate / Admin (input) -->
      <rect x="740" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="40" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="748" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="764" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B2B</text>
      <text x="840" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Corporate / Admin</text>
      <text x="840" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboards · approval</text>

      <!-- Node: Frontend -->
      <rect x="400" y="180" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="180" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="424" y="197" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="500" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frontend</text>
      <text x="500" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React + Vite</text>

      <!-- Node: Backend API (focal) -->
      <rect x="400" y="320" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="320" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="408" y="328" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="424" y="337" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="500" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend API</text>
      <text x="500" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.NET 8 · :5296</text>

      <!-- Node: PostgreSQL (focal) -->
      <rect x="200" y="460" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="460" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="208" y="468" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="222" y="477" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="280" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="280" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared DB</text>

      <!-- Node: python-analytics (optional / scaffold) -->
      <rect x="640" y="460" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="460" width="200" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="648" y="468" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="664" y="477" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="740" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">python-analytics</text>
      <text x="740" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · scaffold</text>

      <!-- Legend strip -->
      <line x1="60" y1="544" x2="940" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="60" y="576" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal (API + DB)</text>

      <rect x="220" y="576" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service</text>

      <rect x="336" y="576" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="356" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Actor</text>

      <rect x="440" y="576" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="460" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Scaffold / WIP</text>

      <line x1="600" y1="580" x2="628" y2="580" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="636" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API</text>

      <line x1="756" y1="580" x2="784" y2="580" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="792" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">DB read/write</text>

      <line x1="884" y1="580" x2="912" y2="580" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="920" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Read-only</text>

  </div>
</body>
</html>
